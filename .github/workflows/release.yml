name: Release

# Cuts tag v<version> + GitHub release when package.json carries a version
# that has no release yet. Releases created with GITHUB_TOKEN do not trigger
# `release: published` workflows, so publish.yml is dispatched explicitly
# against the new tag. npm keeps OIDC trusted publishing (publish.yml:
# id-token: write, no token).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        run: |
          pkg=$(node -p "require('./package.json').version")
          echo "version=$pkg" >> "$GITHUB_OUTPUT"
          if gh release view "v$pkg" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create release
        if: steps.v.outputs.exists == 'false'
        run: |
          gh release create "v${VERSION}" --target "$GITHUB_SHA" \
            --title "v${VERSION}" --generate-notes --latest
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}

      - name: Dispatch publish workflow
        if: steps.v.outputs.exists == 'false'
        run: gh workflow run publish.yml --ref "v${VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
